<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#5b21b6" />
<title>Sem internet · ETI LEITURA</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    background:radial-gradient(700px 500px at 15% 10%,#5b21b6aa,transparent 60%),radial-gradient(600px 500px at 90% 90%,#be185d66,transparent 60%),linear-gradient(160deg,#1b1446,#0c0a24)}
  main{width:min(420px,100%);text-align:center;padding:32px 26px;border-radius:28px;background:#ffffff12;border:1px solid #ffffff22;backdrop-filter:blur(10px)}
  img{width:72px;height:72px;margin-bottom:14px}
  h1{font-size:1.4rem;margin-bottom:8px}
  p{color:#ddd6fe;line-height:1.55;font-size:.95rem}
  button{margin-top:20px;height:46px;padding:0 22px;border:0;border-radius:14px;font:inherit;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#db2777)}
</style>
</head>
<body>
<main>
  <img src="/icons/eti-192.png" alt="" />
  <h1>Você está sem internet</h1>
  <p>A ETI LEITURA precisa de conexão para abrir livros, atividades e salvar seu progresso. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button type="button" onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
